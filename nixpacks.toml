[phases.setup]
nixPkgs = [
  "php83",
  "php83Packages.composer",
  "php83Extensions.zip",
  "php83Extensions.gd",
  "php83Extensions.mbstring",
  "php83Extensions.xml",
  "nginx",
  "nodejs_18"
]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm install"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "php artisan storage:link && php artisan optimize:clear && php artisan serve --host=0.0.0.0 --port=$PORT"